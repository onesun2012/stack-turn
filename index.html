<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>叠转 Stack Turn</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0; height: 100%; overflow: hidden;
        background: #1a1a24; color: #fff;
        font-family: -apple-system, "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", system-ui, sans-serif;
        touch-action: none; overscroll-behavior: none;
        user-select: none; -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;
      }
      #app { height: 100%; }
      canvas { display: block; touch-action: none; }

      #loading {
        position: fixed; inset: 0; z-index: 30;
        display: flex; align-items: center; justify-content: center;
        background: #1a1a24; color: #8a8a9a;
        font-size: 14px; letter-spacing: .2em;
        animation: pulse 1.2s ease-in-out infinite;
      }
      @keyframes pulse { 50% { opacity: .4; } }

      #hud {
        position: fixed; inset: 0; z-index: 10; pointer-events: none;
        display: flex; flex-direction: column; align-items: center;
        padding-top: calc(env(safe-area-inset-top, 0px) + 18px);
      }
      .hud-score {
        font-size: 56px; font-weight: 700; line-height: 1;
        font-variant-numeric: tabular-nums;
        text-shadow: 0 2px 12px rgba(0,0,0,.35);
      }
      .hud-popup {
        margin-top: 10px; font-size: 15px; letter-spacing: .15em; color: #9be8dd;
        animation: popup .85s ease-out forwards;
      }
      .hud-popup.accent { color: #ffd76e; }
      @keyframes popup {
        0%   { opacity: 0; transform: translateY(8px); }
        25%  { opacity: 1; transform: translateY(0); }
        100% { opacity: 0; transform: translateY(-14px); }
      }

      #mute {
        position: fixed; z-index: 20;
        top: calc(env(safe-area-inset-top, 0px) + 14px);
        right: calc(env(safe-area-inset-right, 0px) + 14px);
        width: 40px; height: 40px; border: none; border-radius: 50%;
        background: rgba(255,255,255,.08); color: #fff; font-size: 17px;
        display: flex; align-items: center; justify-content: center;
        transition: opacity .2s;
      }
      #mute.muted { opacity: .35; }

      .screen {
        position: fixed; inset: 0; z-index: 15; pointer-events: none;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center; gap: 8px;
        background: rgba(20, 20, 32, .35);
        transition: opacity .4s ease; opacity: 1;
      }
      .screen.hidden { opacity: 0; visibility: hidden; }
      .off { display: none; }

      #title h1 { margin: 0; font-size: 64px; font-weight: 800; letter-spacing: .12em; }
      #title .sub { margin: 0; font-size: 13px; letter-spacing: .5em; text-indent: .5em; color: #9a9ab0; }
      #title-best { margin: 6px 0 0; font-size: 14px; color: #9be8dd; letter-spacing: .1em; }
      .hint { margin: 26px 0 0; font-size: 14px; color: #b9b9cc; line-height: 1.8; }
      .cta { margin-top: 30px; font-size: 14px; letter-spacing: .3em; animation: pulse 1.6s ease-in-out infinite; }

      #over .label { margin: 0; font-size: 13px; letter-spacing: .4em; text-indent: .4em; color: #9a9ab0; }
      #over-score {
        font-size: 88px; font-weight: 800; line-height: 1.1;
        font-variant-numeric: tabular-nums;
        text-shadow: 0 2px 12px rgba(0,0,0,.35);
      }
      #over-detail { font-size: 15px; color: #ffd76e; letter-spacing: .1em; }
      #over-best { font-size: 14px; color: #9be8dd; letter-spacing: .1em; min-height: 1.2em; }

      /* 分享图片：允许长按保存（覆盖 body 的全局禁用） */
      #share-img {
        margin-top: 8px; height: 32vh; border-radius: 14px;
        box-shadow: 0 10px 40px rgba(0,0,0,.5);
        pointer-events: auto;
        -webkit-touch-callout: default;
        -webkit-user-select: auto; user-select: auto;
      }
      #share-hint { margin: 2px 0 0; font-size: 12px; color: #9a9ab0; letter-spacing: .1em; }
      #save-btn {
        pointer-events: auto; margin-top: 4px;
        border: 1px solid rgba(255,255,255,.25); border-radius: 999px;
        background: rgba(255,255,255,.1); color: #fff;
        font-size: 13px; padding: 9px 26px; letter-spacing: .15em;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="loading">加载中</div>
    <button id="mute" aria-label="切换音效">♪</button>
    <div id="title" class="screen">
      <h1>叠转</h1>
      <p class="sub">STACK TURN</p>
      <p id="title-best" class="off"></p>
      <p class="hint">点按屏幕放下方块<br>每 3 层，滑动方向旋转 90°</p>
      <p class="cta">点按任意处开始</p>
    </div>
    <div id="over" class="screen hidden">
      <p class="label">本次成绩</p>
      <div id="over-score">0</div>
      <div id="over-detail"></div>
      <div id="over-best"></div>
      <img id="share-img" class="off" alt="成绩卡片" />
      <p id="share-hint" class="off">长按图片保存，分享你的塔</p>
      <button id="save-btn" class="off">保存图片</button>
      <p class="cta">点按任意处重开</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
